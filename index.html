<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .perfil {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        h2 {
            color: #555;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .habilidades {
            margin-top: 20px;
        }

        .habilidad {
            display: inline-block;
            background-color: #e5e5e5;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="perfil">

        <h1>Hola, soy Alejandra</h1>

        <h2>Estudiante de Desarrollo de Software</h2>

        <p>
            Soy estudiante de Desarrollo de Software y me interesa
            aprender sobre programación, desarrollo web y bases de datos.
        </p>

        <div class="habilidades">
            <h3>Mis habilidades</h3>

            <span class="habilidad">HTML</span>
            <span class="habilidad">CSS</span>
            <span class="habilidad">Java</span>
            <span class="habilidad">Python</span>
            <span class="habilidad">SQL</span>
        </div>

    </div>

</body>
</html>
